name: Auto Update Dependencies

on:
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday at 3 AM

jobs:
  update-python-deps:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install pip-tools
      run: pip install pip-tools

    - name: Update Python dependencies
      run: |
        cd backend
        pip-compile --upgrade requirements.in || pip-compile --upgrade requirements.txt

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update Python dependencies'
        title: 'Automated Python dependency updates'
        body: |
          This PR contains automated updates to Python dependencies.
          
          Please review the changes and test thoroughly before merging.
          
          **Auto-generated by GitHub Actions**
        branch: auto-update-python-deps
        delete-branch: true

  update-node-deps:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Update Node.js dependencies
      run: |
        cd frontend
        npm update
        npm audit fix

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update Node.js dependencies'
        title: 'Automated Node.js dependency updates'
        body: |
          This PR contains automated updates to Node.js dependencies.
          
          Please review the changes and test thoroughly before merging.
          
          **Auto-generated by GitHub Actions**
        branch: auto-update-node-deps
        delete-branch: true
