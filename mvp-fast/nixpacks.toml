[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
    "python3 -m venv /opt/venv",
    "source /opt/venv/bin/activate && pip install -r backend/requirements.txt"
]

[start]
# Use 1 worker for Railway (NullPool = fresh conn/request; 1 worker minimizes connection load)
# Bootstrap admin in the background: must NOT block gunicorn — if the DB is slow, misconfigured, or
# ensure fails (e.g. unique constraint), the web process still must bind to $PORT for healthchecks.
cmd = "cd backend && source /opt/venv/bin/activate && (python ensure_admin_user.py || echo \"ensure_admin_user.py failed (see logs), starting server anyway\") && gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --timeout 120"

