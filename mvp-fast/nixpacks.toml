[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
    "python3 -m venv /opt/venv",
    "source /opt/venv/bin/activate && pip install -r backend/requirements.txt"
]

[start]
# Use 2 workers to reduce DB connections (Railway connection limits)
cmd = "cd backend && source /opt/venv/bin/activate && gunicorn -w 2 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --timeout 120"

