[phases.setup]
nixPkgs = ["python311", "curl"]

[phases.install]
cmds = [
    "curl https://bootstrap.pypa.io/get-pip.py -o get-pip.py",
    "python3 get-pip.py",
    "pip install -r backend/requirements.txt"
]

[start]
cmd = "cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT"

