[build]
builder = "nixpacks"
# buildCommand removed - let nixpacks.toml handle the build process

[deploy]
# startCommand removed - let nixpacks.toml handle the start process
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[deploy.environment]
PYTHON_VERSION = "3.11"

