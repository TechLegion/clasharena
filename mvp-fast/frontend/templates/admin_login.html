<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ClashArena</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background: var(--color-black); min-height: 100vh; padding: 20px;">
    <div class="container">
        <div class="form-card">
            <div class="logo-container" style="margin-bottom: 20px;">
                <img src="/static/logo.jpg" alt="ClashArena Logo" class="logo" style="max-width: 150px;">
            </div>
            <h1>Admin Login</h1>
            {% if error %}
            <div class="error-message" style="display: block; margin-bottom: 20px;">
                {{ error }}
            </div>
            {% endif %}
            <form method="POST" action="/admin/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
