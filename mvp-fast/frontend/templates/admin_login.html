<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ClashArena</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-login-page">
    <div class="admin-login-card">
        <a href="/"><img src="/static/logo.jpg" alt="ClashArena" class="admin-login-logo"></a>
        <h1>Admin</h1>
        <p class="admin-login-subtitle">Sign in to manage tournaments</p>
        {% if error %}
        <div class="admin-login-error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/admin/login">
            <div class="admin-field">
                <label class="admin-field-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="admin-input" required autofocus>
            </div>
            <div class="admin-field">
                <label class="admin-field-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="admin-input" required>
            </div>
            <button type="submit" class="admin-btn admin-btn-primary">Sign in</button>
        </form>
    </div>
</body>
</html>
